name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Verify SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Support both pasted multiline keys and single-line keys with literal \n.
          if printf '%s' "$SSH_KEY" | grep -q '\\n'; then
            printf '%b' "$SSH_KEY" > /tmp/key.pem
          else
            printf '%s\n' "$SSH_KEY" > /tmp/key.pem
          fi
          tr -d '\r' < /tmp/key.pem > /tmp/key.pem.clean
          mv /tmp/key.pem.clean /tmp/key.pem
          chmod 600 /tmp/key.pem
          ssh-keygen -lf /tmp/key.pem

      - name: Connect to EC2 and deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/learnGithubactions
            git pull origin main
            sudo docker rm -f learn-github-actions || true
            sudo docker build -t learn-github-actions .
            sudo docker run -d -p 3000:3000 --name learn-github-actions learn-github-actions
